[build]
  publish = "website"
  # Writes the Gemini key from the Netlify environment variable GEMINI_API_KEY into the deployed site.
  command = "echo \"window.GEMINI_API_KEY = '$GEMINI_API_KEY';\" > website/js/config.local.js"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
